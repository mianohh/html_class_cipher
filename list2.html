<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h2>Default List</h2>
    <ol>    
        <li>Orange</li>
        <li>Mango</li>
        <li>Banana</li>
        <li>Apple</li>
    </ol>
    <h2>Lower Alphabets</h2>
    <ol type="a">    
        <li>Red</li>
        <li>Blue</li>
        <li>Green</li>
        <li>Yellow</li>
    </ol>
    <h2>Upper Alphabets</h2>
    <ol type="A">
        <li>Food</li>
        <li>House</li>
        <li>Water</li>
        <li>Transportation</li>
    </ol>
    <h2>Lower Roman</h2>
    <ol type="i">
        <li>CEO</li>
        <li>Manager</li>
        <li>Workers</li>
        </ol>
</body>
</html>
